# ============================================================
# Docker Compose (Production — Full Stack)
# ============================================================
# Orchestrates:
#   - backend: FastAPI (Gunicorn + Uvicorn) on port 8000
#   - redis:   Redis 7 (AOF persistence for WebSockets & caching)
#   - nginx:   Reverse proxy with SSL for api.apnagreenbasket.com (ports 80 & 443)
# External:
#   - Database: AWS RDS PostgreSQL with strict SSL certificate verification
#   - Frontend: Hosted separately on Vercel (app.apnagreenbasket.com)
# ============================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: agb-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DB_CA_CERT_PATH=/app/certs/rds-ca-bundle.pem
      - REDIS_URL=redis://agb-redis:6379/0
    volumes:
      - ./uploads:/app/uploads
      - ./certs:/app/certs:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: agb-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  nginx:
    image: nginx:1.27-alpine
    container_name: agb-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot-webroot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

networks:
  app-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
