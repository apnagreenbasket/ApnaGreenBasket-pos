events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    # Real IP mapping: prefer CF-Connecting-IP (Cloudflare) if present, fallback to remote_addr
    map $http_cf_connecting_ip $client_real_ip {
        ""      $binary_remote_addr;
        default $http_cf_connecting_ip;
    }

    # Rate Limiting Zones (in-memory C tracking)
    # 1. General API: 30 requests/sec per IP, burst 50
    limit_req_zone $client_real_ip zone=api_limit:10m rate=30r/s;

    # 2. Strict Auth & Login Zone: 5 requests/sec per IP, burst 10
    limit_req_zone $client_real_ip zone=auth_limit:10m rate=5r/s;

    # 3. Connection Limiting: Max 25 simultaneous TCP connections per IP
    limit_conn_zone $client_real_ip zone=conn_limit:10m;

    # Set rate limiting HTTP status code to 429 (Too Many Requests)
    limit_req_status 429;
    limit_conn_status 429;

    # WebSocket upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream containers
    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    # ============================================================
    # 1. HTTP -> HTTPS Redirect & Let's Encrypt ACME Challenges
    # ============================================================
    server {
        listen 80;
        server_name api.apnagreenbasket.com;

        # Let's Encrypt automated verification endpoint
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============================================================
    # 2. HTTPS — Backend API (api.apnagreenbasket.com)
    # ============================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name api.apnagreenbasket.com;

        # SSL Certificates (managed by Certbot)
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Modern TLS configurations
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Limit concurrent connections per IP
        limit_conn conn_limit 25;

        # Custom JSON error page for rate limited requests
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"detail":"Too many requests. Please slow down and try again in a few moments."}';
        }

        # ── Strict Rate Limiting for Auth & Login Endpoints ──
        # Protects /api/auth/* and /api/staff/login, /api/staff/pin-login from brute-force & floods
        location ~* ^/api/(auth/|staff/(login|pin-login)) {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # ── General API & WebSockets ──
        location / {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

            # Extended timeouts for WebSockets (POS / Live Orders)
            proxy_connect_timeout 60s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;

            # WebSocket Support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
