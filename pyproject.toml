[project]
name = "restaurant-saas"
version = "0.1.0"
description = "Multi-tenant B2B dynamic menu & ordering SaaS"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",
    # Redis
    "redis[hiredis]>=5.0.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=23.1.0",
    # Validation & settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",
    # Payments
    "razorpay>=1.4.1",
    "httpx>=0.27.0",
    # QR codes
    "qrcode[pil]>=7.4.2",
    # Storage
    "boto3>=1.34.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # Utilities
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "pytest>=9.1.1",
    "aiosqlite>=0.20.0",
    "cloudinary>=1.41.0",
    "pytest-asyncio>=1.4.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "fpdf2>=2.7.0",
    "sqladmin>=0.31.1",
    "itsdangerous>=2.2.0",
    "gunicorn>=26.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
    "aiosqlite>=0.20.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"
